---
# Canonical destination: /home/markascl/graha-selang.markas.cloud/wp-content/plugins/graha-selang-site-core/
deployment:
  tasks:
    - export PLUGINROOT=/home/markascl/graha-selang.markas.cloud/wp-content/plugins
    - export DEPLOYPATH=$PLUGINROOT/graha-selang-site-core
    - export STAGEPATH=$PLUGINROOT/.graha-selang-site-core.deploy
    - export BACKUPPATH=$PLUGINROOT/.graha-selang-site-core.previous
    - /bin/rm -rf "$STAGEPATH" "$BACKUPPATH"
    - /bin/mkdir -p "$STAGEPATH"
    - /bin/cp -R plugin/graha-selang-site-core/. "$STAGEPATH/"
    - /bin/sh -c 'set -eu; if [ -d "$DEPLOYPATH" ]; then /bin/mv "$DEPLOYPATH" "$BACKUPPATH"; fi; if /bin/mv "$STAGEPATH" "$DEPLOYPATH"; then /bin/rm -rf "$BACKUPPATH"; else status=$?; if [ -d "$BACKUPPATH" ]; then /bin/mv "$BACKUPPATH" "$DEPLOYPATH"; fi; exit "$status"; fi'
