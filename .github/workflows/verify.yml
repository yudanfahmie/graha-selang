name: verify

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Run repository verification
        shell: bash
        run: |
          set +e
          chmod +x scripts/verify.sh
          ./scripts/verify.sh 2>&1 | tee verify.log
          status=${PIPESTATUS[0]}
          exit "$status"
      - name: Upload verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-log
          path: verify.log
          if-no-files-found: error
